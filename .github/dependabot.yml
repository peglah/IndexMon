version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      jest:
        patterns:
          - "jest"
          - "@types/jest"
          - "ts-jest"
          - "@jest/*"
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "@typescript-eslint/*"
      tooling:
        patterns:
          - "typescript"
          - "tsx"
          - "globals"
          - "@types/*"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "@typescript-eslint/*"
      build:
        patterns:
          - "vite"
          - "vitest"
          - "@vitejs/*"
          - "jsdom"
          - "postcss"
          - "tailwindcss"
          - "@tailwindcss/*"
          - "lightningcss"
      tooling:
        patterns:
          - "typescript"
          - "globals"
          - "@types/*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
