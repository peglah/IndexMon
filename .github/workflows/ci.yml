name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend — Install
        working-directory: backend
        run: npm ci

      - name: Backend — Lint
        working-directory: backend
        run: npm run lint

      - name: Backend — Typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Backend — Test
        working-directory: backend
        run: npm test
        env:
          DB_PATH: ./test-data/test.db

      - name: Frontend — Install
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Frontend — Lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend — Test
        working-directory: frontend
        run: npm test

  build-and-publish:
    needs: lint-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version || 'dev' }}

      - name: Start container for screenshot
        if: startsWith(github.ref, 'refs/tags/v')
        # Empty .env is fine: container generates a random admin password
        # on startup, and Playwright intercepts all API routes via
        # page.route() so no real backend services are needed.
        run: |
          touch .env
          docker compose up -d

      - name: Wait for container to be ready
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost && exit 0
            sleep 2
          done
          exit 1

      - name: Take screenshot
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          npm install playwright@1.60.0
          npx playwright install chromium --with-deps
          node scripts/screenshot.mjs

      - name: Upload screenshot to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" --generate-notes || true
          gh release upload "${{ github.ref_name }}" screenshot-light.png screenshot-dark.png screenshot-light-mobile.png screenshot-dark-mobile.png --clobber
